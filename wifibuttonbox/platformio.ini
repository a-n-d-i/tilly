; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Pinned to the 7.x line so the bundled Arduino-ESP32 core (3.x/IDF5) matches
; what's already verified working via the Arduino IDE (core 3.3.11), rather
; than the older cached 6.x/core-2.x toolchain PlatformIO would otherwise pick.
platform = espressif32 @ ^7.1.3
board = esp32dev
framework = arduino
#upload_protocol = espota
#upload_port = 10.232.18.25 ; Replace with your device's actual IP address or mDNS name (e.g., mydevice.local)

monitor_speed = 115200
upload_speed = 115200

; QIO/80MHz flash settings previously selected in the Arduino IDE.
board_build.partitions = min_spiffs.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L

lib_deps =
    arduinogetstarted/ezButton @ ^1.0.6
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit ILI9341 @ ^1.6.1
    https://github.com/okalachev/mavlink-arduino.git
    links2004/WebSockets @ ^2.7.3
    bblanchon/ArduinoJson @ ^7.4.3
