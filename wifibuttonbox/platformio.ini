; PlatformIO Project Configuration File
;
; Waveshare ESP32-S3-RLCD-4.2 ("eLCD"): ESP32-S3 N16R8 (16MB flash, 8MB
; octal PSRAM) with a 400x300 ST7305 reflective LCD, driven here over SPI
; via U8g2. A PCF8574T I/O expander with 6 buttons is wired to the shared
; I2C bus, its INT line on GPIO17. See include/board_pins.h for the full
; pin map, including the ArduPilot MAVLink UART on the P1 expansion header.
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-elcd42]
platform = espressif32 @ ^7.1.3
board = esp32-s3-devkitc-1
framework = arduino

; This board has no USB-UART bridge chip - USB-C goes straight to the S3's
; native USB peripheral. Without this flag, Arduino's Serial stays bound to
; UART0 (unconnected on this board) and only low-level IDF log_e()/log_w()
; boot messages reach the USB-C port, not the sketch's own Serial prints.
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
upload_speed = 921600
;upload_protocol = espota
;upload_port = tilly-buttonbox.local

; N16R8 module: 16MB QIO flash, 8MB octal PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
; Dual OTA app slots plus a spiffs partition for the web dashboard
; (data/index.html, uploaded separately via `pio run -t uploadfs`).
board_build.partitions = default_16MB.csv

lib_deps =
    olikraus/U8g2 @ ^2.36.18
    mathertel/OneButton @ ^2.6.2
    robtillaart/PCF8574 @ ^0.4.5
    https://github.com/okalachev/mavlink-arduino.git
    links2004/WebSockets @ ^2.7.3
    bblanchon/ArduinoJson @ ^7.4.3
